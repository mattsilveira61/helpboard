# Sistema inteiro: docker compose up --build  →  http://localhost:5500
# Só o banco (API rodando fora do Docker, para desenvolver): docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: helpboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o banco de testes na primeira inicialização
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: helpboard-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro da rede do compose o banco se chama "postgres", não localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: helpboard-web
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Mesma porta do desenvolvimento: já está em CORS_ORIGINS e o frontend aponta para a API em :8000
      - "5500:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
