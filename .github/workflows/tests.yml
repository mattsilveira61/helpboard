name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: API (lint + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helpboard
          POSTGRES_PASSWORD: helpboard
          POSTGRES_DB: helpboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://helpboard:helpboard@localhost:5432/helpboard_test
      TEST_DATABASE_URL: postgresql+psycopg://helpboard:helpboard@localhost:5432/helpboard_test
      SECRET_KEY: chave-de-teste-do-ci-1234567890
      DEMO_PASSWORD: helpboard123
      CORS_ORIGINS: http://localhost:5500
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: pytest
