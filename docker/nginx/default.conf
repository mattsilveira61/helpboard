# Serve o frontend estático (HTML, CSS e JS puro, sem build).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Módulos ES precisam do tipo certo; o mime.types padrão já cobre .js e .svg
    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sem cache no HTML, para uma versão nova aparecer sem precisar limpar o navegador.
    # (um add_header aqui dentro anula os de cima, por isso eles se repetem)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
